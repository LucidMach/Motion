name: Backend Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # directional_routing and server/services (per pytest.ini) are fully
        # self-contained - server/services' tests build their own temp
        # sqlite fixtures rather than touching the real GTFS database.
        run: pytest -v
